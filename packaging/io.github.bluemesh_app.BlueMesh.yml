# Flatpak manifest skeleton for BlueMesh. NOT submitted to Flathub.
#
# TODO(Dyl) before a real build/submission:
#   1. Replace the local "dir" source below with a pinned git source (URL,
#      tag and commit) once the release tag exists.
#
# Done: donation URL in the metainfo is https://buymeacoffee.com/bluemesh.app.
# Done: app id is io.github.bluemesh_app.BlueMesh (GitHub account
# bluemesh-app) everywhere, including gui/bluemesh.py APP_ID and the desktop
# StartupWMClass. The crate sources are generated in
# packaging/cargo-sources.json and included below.
#
# Runtime note: org.gnome.Platform already provides Python 3, PyGObject,
# GTK 4 and libadwaita; the GUI needs no vendored Python packages.

id: io.github.bluemesh_app.BlueMesh
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: io.github.bluemesh_app.BlueMesh

finish-args:
  # Nostr location channels, and Bluetooth also needs network access in Flatpak.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # BLE scanning/advertising: AF_BLUETOOTH sockets plus BlueZ on the system bus.
  - --allow=bluetooth
  - --system-talk-name=org.bluez

  # Desktop notifications. File picker and OpenURI use xdg-desktop-portal, so no
  # broad home/filesystem permission is requested.
  - --talk-name=org.freedesktop.Notifications

  - --env=BLUEMESHD=/app/bin/bluemeshd

modules:
  - name: bluemesh
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/bluemesh/cargo
    build-commands:
      - cargo build --release --locked --offline --manifest-path backend/Cargo.toml --bin bluemeshd
      - install -Dm755 backend/target/release/bluemeshd /app/bin/bluemeshd
      - install -Dm755 packaging/io.github.bluemesh_app.BlueMesh.sh /app/bin/io.github.bluemesh_app.BlueMesh
      - install -Dm644 gui/bluemesh.py /app/lib/bluemesh/bluemesh.py

      - install -Dm644 packaging/io.github.bluemesh_app.BlueMesh.desktop /app/share/applications/io.github.bluemesh_app.BlueMesh.desktop
      - install -Dm644 packaging/io.github.bluemesh_app.BlueMesh.metainfo.xml /app/share/metainfo/io.github.bluemesh_app.BlueMesh.metainfo.xml

      # App icon: PNGs in data/icons/bluemesh-<size>.png (made from the logo in
      # data/icons/bluemesh-logo-source.png). Installed under the app id, plus a
      # "bluemesh" alias for anything still using the old icon name.
      - |
        for s in 32 48 64 128 256 512; do
          install -Dm644 data/icons/bluemesh-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.bluemesh_app.BlueMesh.png
          install -Dm644 data/icons/bluemesh-$s.png /app/share/icons/hicolor/${s}x${s}/apps/bluemesh.png
        done

      - install -Dm644 LICENSE /app/share/licenses/io.github.bluemesh_app.BlueMesh/LICENSE
      - install -Dm644 backend/LICENSE /app/share/licenses/io.github.bluemesh_app.BlueMesh/LICENSE.bitmancer

    sources:
      # TODO(Flathub): replace this local directory with an immutable git source:
      #
      #   - type: git
      #     url: https://github.com/bluemesh-app/BlueMesh.git
      #     tag: v0.1.0
      #     commit: <full 40-character commit id>
      #
      - type: dir
        path: ..
        skip:
          - .git
          - backend/target
          - .flatpak-builder
          - build-dir
          - repo
          - shots
          - __pycache__

      - cargo-sources.json
